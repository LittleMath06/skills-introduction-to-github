name: CI — Sistema de prospecção

on:
  push:
    paths: ["src/**", "tests/**", "requirements*.txt", "pyproject.toml", ".github/workflows/ci.yml"]
  pull_request:
    paths: ["src/**", "tests/**", "requirements*.txt", "pyproject.toml", ".github/workflows/ci.yml"]

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: prospeccao_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 10s --health-timeout 5s --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install -r requirements-dev.txt
      - run: python -m playwright install --with-deps chromium
      - name: Testes (SQLite)
        run: python -m pytest -q
        env:
          CHROMIUM_PATH: ""
      - name: Testes (PostgreSQL)
        run: python -m pytest -q
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/prospeccao_test
          CHROMIUM_PATH: ""
